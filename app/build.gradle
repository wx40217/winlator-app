apply plugin: 'com.android.application'

// Upstream guest ELF files embed absolute paths. Keep the package byte length
// unchanged so extraction can rebase those paths without moving ELF offsets.
def forkApplicationId = 'com.wxwinlat'
assert forkApplicationId.length() == 'com.winlator'.length()

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId forkApplicationId
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 34
        versionName "11.2-fork.1"

        externalNativeBuild {
            cmake {
                arguments "-DWINLATOR_APPLICATION_ID=${forkApplicationId}"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
}
